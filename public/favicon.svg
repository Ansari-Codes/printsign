<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1020"/>
      <stop offset="50%" stop-color="#060a14"/>
      <stop offset="100%" stop-color="#03050a"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Shield Primary Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="40%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Inner Core Shield Gradient -->
    <linearGradient id="innerShieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Checkmark Glow Gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="url(#borderGrad)" stroke-width="8" stroke-opacity="0.65"/>

  <!-- Subtle Radial Ambient Light -->
  <circle cx="256" cy="220" r="160" fill="#06b6d4" opacity="0.12"/>

  <!-- Outer Shield Aura -->
  <path d="M256 76 L392 136 C392 276 332 376 256 424 C180 376 120 276 120 136 Z" 
        fill="url(#shieldGrad)" 
        filter="url(#neonGlow)"/>

  <!-- Inner Dark Shield Plate -->
  <path d="M256 102 L368 152 C368 266 318 350 256 392 C194 350 144 266 144 152 Z" 
        fill="url(#innerShieldGrad)" 
        stroke="url(#borderGrad)" 
        stroke-width="5" 
        stroke-opacity="0.8"/>

  <!-- Redaction Verification / Security Mark (Central Check & Document Lines) -->
  <!-- Document Horizontal Secure Rule Lines -->
  <line x1="200" y1="184" x2="312" y2="184" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
  <line x1="200" y1="220" x2="260" y2="220" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.4"/>

  <!-- Glowing Cryptographic Checkmark -->
  <path d="M208 268 L244 304 L318 214" 
        fill="none" 
        stroke="url(#checkGrad)" 
        stroke-width="26" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
